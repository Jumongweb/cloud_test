scrape_configs:
  - job_name: 'spring-boot-app'
    static_configs:
      - targets: ['localhost:9090', 'app:5050', 'localhost:9100', 'localhost:9113']
    metrics_path: '/actuator/prometheus'  # Use the correct actuator endpoint

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:8080']
        labels:
          application: "Spring boot app"

