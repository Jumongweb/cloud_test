services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

#    environment:
#      POSTGRES_USER: postgres
#      POSTGRES_PASSWORD: cloud_test@8080
#      POSTGRES_DB: cloud_test
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    image: jumongweb/cloud_test:latest
    volumes:
      - /mnt/c/Users/DELL/Documents/SEMICOLON/cloned/cloud_test:/mnt/c/Users/DELL/Documents/SEMICOLON/cloned/cloud_test
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
#    environment:
#      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloud_test
#      SPRING_DATASOURCE_USERNAME: postgres
#      SPRING_DATASOURCE_PASSWORD: cloud_test@8080
    depends_on:
      - postgres
    deploy:
#      replicas: 3  # Number of instances you want
      resources:
        limits:
          memory: 128M
    ports:
       - "5050:5050"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5050/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
        - ./alert.rules:/etc/prometheus/alert.rules
        - prometheus_data:/prometheus
    ports:
      - "9091:9090"

#  node_exporter:
#    image: prom/node-exporter
#    ports:
#      - "9100:9100"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  app-network:
    driver: bridge


volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
